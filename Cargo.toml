[workspace]
resolver = "3"
members = [
    "common",
    "app",
    "daemon",
    "ssh",
    "runtime",
    "theme-iced"
]

[workspace.package]
authors = ["Kitsu/VM <kitsuvm@gmail.com>"]
repository = "https://github.com/kitsuvm/kitty-server"
edition = "2024"
license = "AGPL-3.0-or-later"
readme = "README.md"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
clap = "4.6.5"
directories = "6.0.0"
futures-core = "0.3.33"
futures-sink = "0.3.33"
kitty-server-common = { path = "common", version = "0.0.1-alpha.1" }
kitty-server-runtime = { path = "runtime", version = "0.0.1-alpha.1" }
kitty-theme-iced = { path = "theme-iced", version = "0.0.1-alpha.1" }
iced = { version = "0.14.0", default-features = false }
iced_anim = { version = "0.3.0", default-features = false }
iced_core = { version = "0.14.0", default-features = false }
iced_futures = { version = "0.14.0", default-features = false }
iced_runtime = { version = "0.14.0", default-features = false }
iced_widget = { version = "0.14.0", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
sysinfo = "0.39.6"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
unsigned-varint = "0.8.0"
uzers = "0.12.2"
winres = "0.1.12"
